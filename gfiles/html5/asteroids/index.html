<!DOCTYPE html>
<html>
  <head>
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="game" />
    <meta name="twitter:site" content="@benallfree" />
    <meta name="twitter:title" content="HTML5 Asteroids" />
    <meta
      name="twitter:description"
      content="Classic arcade Asteroids game reimagined in pure Javascript and HTML5. Blast through space, destroy asteroids, and survive!"
    />
    <meta
      name="twitter:image"
      content="https://gfiles.benallfree.com/asteroids/screenshot.webp"
    />
    <meta
      name="twitter:player"
      content="https://gfiles.benallfree.com/asteroids"
    />
    <meta name="twitter:player:width" content="1024" />
    <meta name="twitter:player:height" content="576" />
    <script src="jquery-1.4.1.min.js"></script>
    <script src="vector_battle_regular.typeface.js"></script>
    <script src="ipad.js"></script>
    <script src="game.js"></script>
    <style>
      body {
        background-color: #000;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #canvas {
        background-color: #fff;
        width: 100%;
        height: 100%;
        display: block;
      }
      .button {
        position: absolute;
        border: 1px solid black;
        background: rgba(255, 255, 255, 0.3);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        user-select: none;
      }
      #left-controls {
        position: absolute;
        left: 1px;
        bottom: 0px;
        display: none;
      }
      #right-controls {
        position: absolute;
        right: 1px;
        bottom: 0px;
        display: none;
      }
      #up {
        width: 200px;
        height: 100px;
        bottom: 100px;
      }
      #left {
        width: 100px;
        height: 100px;
        bottom: 0px;
      }
      #right {
        width: 100px;
        height: 100px;
        bottom: 0px;
        left: 100px;
      }
      #space {
        width: 200px;
        height: 200px;
        bottom: 0px;
        right: 0px;
      }
      #share-container {
        position: absolute;
        left: 50%;
        top: 60%;
        transform: translateX(-50%);
        display: none;
        text-align: center;
      }
      #share-button {
        background: #1da1f2;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        font-family: Arial, sans-serif;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }
      #share-button:hover {
        background: #1991db;
      }
      #copy-toast {
        position: fixed;
        left: 50%;
        top: 70%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        color: #000;
        padding: 8px 16px;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      #copy-toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="canvas"></canvas>
      <div id="left-controls">
        <div id="up" class="button">THRUST</div>
        <div id="left" class="button">LEFT</div>
        <div id="right" class="button">RIGHT</div>
      </div>
      <div id="right-controls">
        <div id="space" class="button">FIRE</div>
      </div>
    </div>
    <div id="share-container">
      <div style="color: white; margin-bottom: 10px">
        ~~Share your high score on X~~
      </div>
      <button id="share-button">Share Score</button>
    </div>
    <div id="copy-toast">Copied!</div>
    <script>
      // Set canvas size to match window size
      function resizeCanvas() {
        const canvas = document.getElementById('canvas')
        canvas.width = window.innerWidth
        canvas.height = window.innerHeight
      }

      // Initial resize
      resizeCanvas()

      // Resize canvas when window is resized
      window.addEventListener('resize', resizeCanvas)
    </script>
  </body>
</html>
